# Render Blueprint — MaliScan API on Render's FREE web service plan.
# Render → New → Blueprint → select this repository. Secrets marked `sync: false`
# are asked for during setup. Guide: maliscan/docs/UCRETSIZ_KURULUM.md
services:
  - type: web
    name: maliscan-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: maliscan
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - { key: ENVIRONMENT, value: production }
      - { key: WEB_CONCURRENCY, value: "1" }
      - { key: EMBEDDED_WORKER, value: "true" }          # worker runs inside the API (free plan has no workers)
      - { key: RUN_MIGRATIONS_ON_STARTUP, value: "true" }
      - { key: STORAGE_BACKEND, value: supabase }        # free disk is ephemeral → files in Supabase Storage
      - { key: DB_POOL_SIZE, value: "3" }
      - { key: DB_MAX_OVERFLOW, value: "2" }
      - { key: CORS_ORIGINS, value: '["https://luca.canarslan.net.tr"]' }
      - { key: PUBLIC_APP_URL, value: https://luca.canarslan.net.tr }
      - { key: SIGNING_SECRET, generateValue: true }
      - { key: DATABASE_URL, sync: false }               # Supabase → Connect → Session pooler (IPv4)
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_JWT_SECRET, sync: false }        # optional (legacy HS256); JWKS is used when empty
      - { key: ANTHROPIC_API_KEY, sync: false }          # optional & paid; empty = manual entry mode
